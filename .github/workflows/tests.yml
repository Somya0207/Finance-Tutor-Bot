name: tests
on: [push, pull_request]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install light dependencies (no torch needed: embeddings are faked in tests)
        run: pip install pytest pypdf reportlab python-dotenv chromadb langchain-core langchain-chroma langchain-text-splitters
      - run: pytest -q
